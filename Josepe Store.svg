<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 315" width="315" height="315">
    <defs>
        <linearGradient id="bagGradient" x1="157.5" y1="96" x2="157.5" y2="290" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7C3AED" />
            <stop offset="60%" stop-color="#6D28D9" />
            <stop offset="100%" stop-color="#4C1D95" />
        </linearGradient>

        <linearGradient id="rimGradient" x1="58" y1="105" x2="257" y2="105" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#8B5CF6" />
            <stop offset="100%" stop-color="#6D28D9" />
        </linearGradient>

        <linearGradient id="cubeGradient" x1="197.69" y1="63.14" x2="126.26" y2="186.86" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFF00" />
            <stop offset="100%" stop-color="#FF7D00" />
        </linearGradient>
    </defs>

    <!-- Shopping Bag Handle Background -->
    <path
        d="M 122,105 C 122,32 193,32 193,105"
        stroke="#A78BFA"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none" />

    <!-- Shopping Bag Handle Shadow -->
    <path
        d="M 122,105 C 122,35 193,35 193,105"
        stroke="#7C3AED"
        stroke-width="8"
        stroke-linecap="round"
        fill="none" />

    <!-- Shopping Bag Main Body -->
    <path
        d="M 64,96 L 251,96 C 257,96 261,100 260,106 L 244,280 C 243,286 238,290 232,290 L 83,290 C 77,290 72,286 71,280 L 55,106 C 54,100 58,96 64,96 Z"
        fill="url(#bagGradient)" />

    <!-- Shopping Bag Right Side Shading (Depth) -->
    <path
        d="M 157.5,96 L 251,96 C 257,96 261,100 260,106 L 244,280 C 243,286 238,290 232,290 L 157.5,290 Z"
        fill="#000000"
        fill-opacity="0.1" />

    <!-- Shopping Bag Top Fold Rim -->
    <path
        d="M 58,96 L 257,96 L 254,114 L 61,114 Z"
        fill="url(#rimGradient)" />

    <!-- Shopping Bag Front Handle Overlap -->
    <path
        d="M 122,114 L 122,96 M 193,114 L 193,96"
        stroke="#C4B5FD"
        stroke-width="10"
        stroke-linecap="round"
        fill="none" />

    <!-- Authentic Josepe Chat Cube - Scaled down & positioned on the front of the bag -->
    <g transform="translate(70.02, 125.5) scale(0.54)">
        <!-- Rotating Card (Gradient Fill) -->
        <path
            d="M255.42,96.47L139.95,29.81A4.76,4.76 118.28,0 0,133.45 31.55L66.78,147.02A4.76,4.76 118.28,0 0,68.52 153.53L183.99,220.19A4.76,4.76 118.28,0 0,190.5 218.45L257.17,102.98A4.76,4.76 118.28,0 0,255.42 96.47z"
            fill="url(#cubeGradient)" />

        <!-- Rotating Card (Black Border Outline) -->
        <path
            d="M255.42,96.47L139.95,29.81A4.76,4.76 118.28,0 0,133.45 31.55L66.78,147.02A4.76,4.76 118.28,0 0,68.52 153.53L183.99,220.19A4.76,4.76 118.28,0 0,190.5 218.45L257.17,102.98A4.76,4.76 118.28,0 0,255.42 96.47z"
            stroke="#000000"
            stroke-width="9"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none" />

        <!-- Left Eye -->
        <path
            d="M190.7,160.13m10.78,6.23a12.45,12.45 93.63,1 0,-21.56 -12.45a12.45,12.45 93.63,1 0,21.56 12.45"
