            stroke-width="1.8" />

        <!-- Right Eye -->
        <path
            d="M117.19,117.68m10.78,6.23a12.45,12.45 93.63,1 0,-21.56 -12.45a12.45,12.45 93.63,1 0,21.56 12.45"
            fill="#000000"
            stroke="#000000"
            stroke-width="1.2" />

        <!-- Mouth -->
        <path
            d="M173.89,179.01L109.24,141.69A3.87,4.76 120,0 0,103.18 142.66L103.18,142.66A3.87,4.76 120,0 0,105.36 148.4L170.02,185.72A3.87,4.76 120,0 0,176.08 184.75L176.08,184.75A3.87,4.76 120,0 0,173.89 179.01z"
